<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>水果忍者 · Fruit Ninja</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#0a0710;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
  }
  #game {
    display:block; width:100%; height:100%;
    touch-action:none; cursor:crosshair;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function(){
'use strict';

/* ============================================================
   基礎設定
============================================================ */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif';

let W = 0, H = 0, DPR = 1;
let bgCanvas = null;
const GRAV = 1500;
const RESTART_BTN = { x: 22, y: 22, size: 42 };

/* ============================================================
   水果定義
============================================================ */
const TYPES = {
  watermelon: { r:56, skin:'#1c6b2e', skin2:'#3fbf5a', flesh:'#f2455c', flesh2:'#ff97a6',
                juice:'#f2455c', stripes:true, seeds:true },
  orange:     { r:44, skin:'#d96b12', skin2:'#ffb347', flesh:'#ff9f1a', flesh2:'#ffd9a0',
                juice:'#ff9f1a', dots:true },
  apple:      { r:42, skin:'#b01c26', skin2:'#f2464f', flesh:'#fff2cf', flesh2:'#fffdf2',
                juice:'#e8404a', leaf:true, seeds:true },
  lemon:      { r:38, skin:'#c99b00', skin2:'#ffe14d', flesh:'#ffe066', flesh2:'#fffbd4',
                juice:'#ffe066' },
  plum:       { r:34, skin:'#4c2280', skin2:'#9b59d0', flesh:'#e3c9f5', flesh2:'#f9f1ff',
                juice:'#9b59d0', seeds:true }
};
const TYPE_KEYS = Object.keys(TYPES);

/* ============================================================
   遊戲狀態
============================================================ */
const G = {
  state: 'menu',          // menu | playing
  score: 0,
  best: parseInt(localStorage.getItem('fn_best') || '0', 10) || 0,
  time: 0,
  fruits: [],
  halves: [],
  particles: [],
  juice: [],
  waves: [],
  slashes: [],
  popups: [],
  blade: [],
  spawnTimer: 0,
  combo: 0,
  comboTimer: 0,
  shake: 0,
  flash: 0,
  hitStop: 0
};

let isSlicing = false;
let lastPos = { x: 0, y: 0 };

/* ============================================================
   音效
============================================================ */
let actx = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
}
function playSlice() {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(1500 + Math.random() * 500, t);
  o.frequency.exponentialRampToValueAtTime(260, t + 0.13);
  g.gain.setValueAtTime(0.13, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + 0.14);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + 0.16);
}
function playCombo(n) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(520 + n * 110, t);
  o.frequency.exponentialRampToValueAtTime(880 + n * 130, t + 0.14);
  g.gain.setValueAtTime(0.10, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + 0.18);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + 0.2);
}

/* ============================================================
   畫布尺寸 / 背景
============================================================ */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width = Math.floor(W * DPR);
  cvs.height = Math.floor(H * DPR);
  cvs.style.width = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  makeBg();
}

function makeBg() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = Math.floor(W * DPR);
  bgCanvas.height = Math.floor(H * DPR);
  const c = bgCanvas.getContext('2d');
  c.setTransform(DPR, 0, 0, DPR, 0, 0);

  const g = c.createRadialGradient(W / 2, H * 0.38, 0, W / 2, H * 0.55, Math.max(W, H) * 0.85);
  g.addColorStop(0, '#2c2140');
  g.addColorStop(0.45, '#1a1226');
  g.addColorStop(1, '#08060d');
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);

  const glow = c.createRadialGradient(W * 0.5, H * 1.02, 0, W * 0.5, H * 1.02, W * 0.7);
  glow.addColorStop(0, 'rgba(255,120,80,0.10)');
  glow.addColorStop(1, 'rgba(255,120,80,0)');
  c.fillStyle = glow;
  c.fillRect(0, 0, W, H);

  c.globalAlpha = 0.035;
  for (let i = 0; i < 400; i++) {
    c.fillStyle = Math.random() > 0.5 ? '#fff' : '#000';
    c.fillRect(Math.random() * W, Math.random() * H, 1.5, 1.5);
  }
  c.globalAlpha = 1;
}

/* ============================================================
   工具函式
============================================================ */
function segCircle(p1, p2, cx, cy, r) {
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const l2 = dx * dx + dy * dy;
  let t = 0;
  if (l2 > 0) t = ((cx - p1.x) * dx + (cy - p1.y) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  const px = p1.x + t * dx, py = p1.y + t * dy;
  const d2 = (cx - px) * (cx - px) + (cy - py) * (cy - py);
  return d2 <= r * r;
}

function addPopup(x, y, text, color, size) {
  G.popups.push({ x, y, text, color, size: size || 26, life: 1.0, maxLife: 1.0, vy: -95 });
}

function addParticles(x, y, color, count, power) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 50 + Math.random() * power;
    const life = 0.4 + Math.random() * 0.55;
    G.particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 90,
      r: 2 + Math.random() * 5,
      color,
      life, maxLife: life
    });
  }
}

/* 強化果汁飛濺 */
function addJuice(x, y, def, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 80 + Math.random() * 460;
    const life = 0.45 + Math.random() * 0.85;
    const size = 2 + Math.random() * 7;
    G.juice.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 150,
      r: size,
      color: Math.random() < 0.5 ? def.juice : def.flesh,
      life, maxLife: life
    });
  }
}

/* ============================================================
   生成水果
============================================================ */
function spawnOne() {
  const scale = Math.min(1.15, Math.max(0.55, Math.min(W, H) / 760));
  const def = TYPES[TYPE_KEYS[Math.floor(Math.random() * TYPE_KEYS.length)]];
  const r = def.r * scale;

  const x = r + 10 + Math.random() * Math.max(1, W - 2 * r - 20);
  const y = H + r + 30;
  const targetH = H * (0.52 + Math.random() * 0.30);
  const vy = -Math.sqrt(2 * GRAV * targetH);
  let vx = (W / 2 - x) * (0.25 + Math.random() * 0.35) + (Math.random() - 0.5) * 150;
  vx = Math.max(-280, Math.min(280, vx));

  G.fruits.push({
    x, y, vx, vy, r,
    rot: Math.random() * Math.PI * 2,
    vrot: (Math.random() - 0.5) * 4,
    def
  });
}

function spawnWave() {
  const n = Math.random() < 0.35 ? 2 : 1;
  for (let i = 0; i < n; i++) spawnOne();
}

/* ============================================================
   切割（強化版）
============================================================ */
function checkSlice(p1, p2) {
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  if (dx * dx + dy * dy < 9) return;
  const angle = Math.atan2(dy, dx);

  for (let i = G.fruits.length - 1; i >= 0; i--) {
    const f = G.fruits[i];
    if (segCircle(p1, p2, f.x, f.y, f.r * 0.98)) {
      G.fruits.splice(i, 1);
      sliceFruit(f, angle);
    }
  }
}

function sliceFruit(f, angle) {
  const def = f.def;
  const nx = -Math.sin(angle), ny = Math.cos(angle);
  const spread = 130 + Math.random() * 90;

  /* --- 兩半飛散 --- */
  for (const side of [1, -1]) {
    G.halves.push({
      x: f.x, y: f.y, r: f.r, def,
      vx: f.vx * 0.75 - nx * spread * side,
      vy: f.vy * 0.75 - ny * spread * side - 90,
      rot: angle,
      vrot: (Math.random() - 0.5) * 5 + side * 3,
      side, life: 3.0
    });
  }

  /* --- 切痕閃光 --- */
  G.slashes.push({
    x: f.x, y: f.y,
    dx: Math.cos(angle), dy: Math.sin(angle),
    len: f.r * 3.0,
    life: 0.3, maxLife: 0.3
  });

  /* --- 衝擊環 --- */
  G.waves.push({
    x: f.x, y: f.y,
    r0: f.r * 0.35, r1: f.r * 3.6,
    life: 0.45, maxLife: 0.45,
    color: def.juice
  });

  /* --- 果汁飛濺 + 碎屑 --- */
  addJuice(f.x, f.y, def, 36);
  addParticles(f.x, f.y, def.flesh2, 10, 200);

  /* --- 打擊感：短暫定格 + 震屏 + 閃光 --- */
  G.hitStop = Math.max(G.hitStop, 0.065);
  G.shake = Math.max(G.shake, 10);
  G.flash = Math.max(G.flash, 0.3);

  playSlice();

  /* --- 計分 + 連擊 --- */
  G.combo++;
  G.comboTimer = 0.75;
  G.score += 1;

  if (G.combo >= 3) {
    G.score += G.combo;
    addPopup(f.x, f.y - f.r * 0.8, '連擊 x' + G.combo, '#ffd24a', 32);
    addPopup(f.x, f.y - f.r * 0.8 + 30, '+' + (G.combo + 1), '#ffffff', 20);
    playCombo(Math.min(G.combo, 8));
  } else {
    addPopup(f.x, f.y - f.r * 0.6, '+1', '#ffffff', 22);
  }
}

/* ============================================================
   遊戲流程
============================================================ */
function startGame() {
  G.state = 'playing';
  G.score = 0;
  G.time = 0;
  G.fruits.length = 0;
  G.halves.length = 0;
  G.particles.length = 0;
  G.juice.length = 0;
  G.waves.length = 0;
  G.slashes.length = 0;
  G.popups.length = 0;
  G.blade.length = 0;
  G.spawnTimer = 0.4;
  G.combo = 0;
  G.comboTimer = 0;
  G.shake = 0;
  G.flash = 0;
  G.hitStop = 0;
}

/* ============================================================
   更新
============================================================ */
function update(dt) {
  /* 命中定格（慢動作） */
  if (G.hitStop > 0) {
    G.hitStop -= dt;
    dt *= 0.1;
  }

  G.shake *= Math.pow(0.0015, dt);
  if (G.shake < 0.4) G.shake = 0;
  G.flash = Math.max(0, G.flash - dt * 3.6);

  if (G.state === 'playing') {
    G.time += dt;
    G.spawnTimer -= dt;
    if (G.spawnTimer <= 0) {
      spawnWave();
      const diff = Math.min(1, G.time / 70);
      G.spawnTimer = (1.15 - diff * 0.72) * (0.65 + Math.random() * 0.7);
      G.spawnTimer = Math.max(0.24, G.spawnTimer);
    }
  }

  /* 水果 */
  for (let i = G.fruits.length - 1; i >= 0; i--) {
    const f = G.fruits[i];
    f.vy += GRAV * dt;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.rot += f.vrot * dt;
    if (f.y - f.r > H + 60 && f.vy > 0) G.fruits.splice(i, 1);
  }

  /* 半塊 */
  for (let i = G.halves.length - 1; i >= 0; i--) {
    const h = G.halves[i];
    h.vy += GRAV * dt;
    h.x += h.vx * dt;
    h.y += h.vy * dt;
    h.rot += h.vrot * dt;
    h.life -= dt;
    if (h.life <= 0 || h.y - h.r > H + 100) G.halves.splice(i, 1);
  }

  /* 粒子 */
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.vy += GRAV * 0.55 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= Math.pow(0.35, dt);
    p.life -= dt;
    if (p.life <= 0) G.particles.splice(i, 1);
  }

  /* 果汁 */
  for (let i = G.juice.length - 1; i >= 0; i--) {
    const j = G.juice[i];
    j.vy += GRAV * 0.85 * dt;
    j.x += j.vx * dt;
    j.y += j.vy * dt;
    j.vx *= Math.pow(0.55, dt);
    j.life -= dt;
    if (j.life <= 0 || j.y > H + 60) G.juice.splice(i, 1);
  }

  /* 衝擊環 */
  for (let i = G.waves.length - 1; i >= 0; i--) {
    G.waves[i].life -= dt;
    if (G.waves[i].life <= 0) G.waves.splice(i, 1);
  }

  /* 切痕 */
  for (let i = G.slashes.length - 1; i >= 0; i--) {
    G.slashes[i].life -= dt;
    if (G.slashes[i].life <= 0) G.slashes.splice(i, 1);
  }

  /* 漂浮文字 */
  for (let i = G.popups.length - 1; i >= 0; i--) {
    const p = G.popups[i];
    p.y += p.vy * dt;
    p.vy *= Math.pow(0.22, dt);
    p.life -= dt;
    if (p.life <= 0) G.popups.splice(i, 1);
  }

  /* 連擊計時 */
  if (G.comboTimer > 0) {
    G.comboTimer -= dt;
    if (G.comboTimer <= 0) { G.combo = 0; G.comboTimer = 0; }
  }
}

/* ============================================================
   繪製：水果
============================================================ */
function drawFruit(f) {
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(f.rot);

  const def = f.def, r = f.r;

  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.38, r * 0.08, 0, 0, r * 1.05);
  g.addColorStop(0, def.skin2);
  g.addColorStop(1, def.skin);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = g; ctx.fill();

  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();

  if (def.stripes) {
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.ellipse(i * r * 0.40, 0, r * 0.085, r * 1.25, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,45,15,0.34)';
      ctx.fill();
    }
  }
  if (def.dots) {
    for (let i = 0; i < 22; i++) {
      const a = i * 2.39996, rad = r * 0.9 * Math.sqrt((i % 9) / 9);
      ctx.beginPath();
      ctx.arc(Math.cos(a) * rad, Math.sin(a) * rad, r * 0.045, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.fill();
    }
  }
  ctx.restore();

  ctx.beginPath();
  ctx.ellipse(-r * 0.34, -r * 0.38, r * 0.26, r * 0.15, -0.6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  ctx.fill();

  if (def.leaf) {
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.86);
    ctx.quadraticCurveTo(r * 0.06, -r * 1.2, r * 0.02, -r * 1.32);
    ctx.lineWidth = Math.max(2, r * 0.09);
    ctx.strokeStyle = '#5a3a1a';
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(r * 0.36, -r * 1.12, r * 0.30, r * 0.14, -0.5, 0, Math.PI * 2);
    ctx.fillStyle = '#4caf50';
    ctx.fill();
  }

  ctx.restore();
}

/* ============================================================
   繪製：半塊（強化切面）
============================================================ */
function drawHalf(h) {
  ctx.save();
  ctx.translate(h.x, h.y);
  ctx.rotate(h.rot);
  ctx.globalAlpha = Math.min(1, h.life / 0.75);

  const r = h.r, def = h.def, s = h.side;

  function halfPath() {
    ctx.beginPath();
    if (s === 1) ctx.arc(0, 0, r, Math.PI, Math.PI * 2);
    else ctx.arc(0, 0, r, 0, Math.PI);
    ctx.closePath();
  }

  /* 果皮底 */
  halfPath();
  const skinGrad = ctx.createLinearGradient(0, -s * r, 0, s * r);
  skinGrad.addColorStop(0, def.skin2);
  skinGrad.addColorStop(1, def.skin);
  ctx.fillStyle = skinGrad;
  ctx.fill();

  /* 果肉切面 */
  ctx.save();
  halfPath();
  ctx.clip();

  const fleshGrad = ctx.createRadialGradient(0, -s * r * 0.35, r * 0.05, 0, 0, r * 1.15);
  fleshGrad.addColorStop(0, def.flesh2);
  fleshGrad.addColorStop(0.6, def.flesh);
  fleshGrad.addColorStop(1, def.flesh);
  ctx.fillStyle = fleshGrad;
  ctx.fillRect(-r, -r, r * 2, r * 2);

  /* 種子 */
  if (def.seeds) {
    for (let i = 0; i < 5; i++) {
      const x = (i - 2) * r * 0.32;
      ctx.beginPath();
      ctx.ellipse(x, -s * r * 0.28, r * 0.052, r * 0.09, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(60,20,20,0.85)';
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x - r * 0.015, -s * r * 0.30, r * 0.018, r * 0.03, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fill();
    }
  }

  /* 果皮內緣 */
  ctx.beginPath();
  if (s === 1) ctx.arc(0, 0, r, Math.PI, Math.PI * 2);
  else ctx.arc(0, 0, r, 0, Math.PI);
  ctx.lineWidth = r * 0.24;
  ctx.strokeStyle = def.skin;
  ctx.stroke();

  ctx.restore();

  /* 切面亮邊（高光） */
  const edgeAlpha = Math.min(1, h.life / 0.35);
  ctx.globalAlpha = ctx.globalAlpha * edgeAlpha * 0.9;

  const edgeGrad = ctx.createLinearGradient(-r, 0, r, 0);
  edgeGrad.addColorStop(0, 'rgba(255,255,255,0)');
  edgeGrad.addColorStop(0.5, 'rgba(255,255,255,0.95)');
  edgeGrad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.moveTo(-r, 0);
  ctx.lineTo(r, 0);
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = edgeGrad;
  ctx.stroke();

  /* 切面光暈 */
  ctx.beginPath();
  ctx.moveTo(-r, 0);
  ctx.lineTo(r, 0);
  ctx.lineWidth = r * 0.42;
  ctx.strokeStyle = def.flesh2;
  ctx.globalAlpha = ctx.globalAlpha * 0.35;
  ctx.stroke();

  ctx.restore();
}

/* ============================================================
   繪製：特效
============================================================ */
function drawParticles() {
  ctx.save();
  for (const p of G.particles) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = a * 0.9;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.7), 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.restore();
}

function drawJuice() {
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  for (const j of G.juice) {
    const a = Math.max(0, j.life / j.maxLife);
    const spd = Math.hypot(j.vx, j.vy);
    const ang = Math.atan2(j.vy, j.vx);
    ctx.globalAlpha = a;
    ctx.save();
    ctx.translate(j.x, j.y);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.ellipse(0, 0, j.r * (1 + spd / 260), j.r, 0, 0, Math.PI * 2);
    ctx.fillStyle = j.color;
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawWaves() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const w of G.waves) {
    const k = 1 - w.life / w.maxLife;
    const r = w.r0 + (w.r1 - w.r0) * (1 - Math.pow(1 - k, 2.2));
    const a = (1 - k) * (1 - k) * 0.85;
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(w.x, w.y, r, 0, Math.PI * 2);
    ctx.lineWidth = 3 + 9 * (1 - k);
    ctx.strokeStyle = w.color;
    ctx.stroke();

    ctx.globalAlpha = a * 0.5;
    ctx.beginPath();
    ctx.arc(w.x, w.y, r * 0.62, 0, Math.PI * 2);
    ctx.lineWidth = 1.5 + 4 * (1 - k);
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();
  }
  ctx.restore();
}

function drawSlashes() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const s of G.slashes) {
    const a = s.life / s.maxLife;
    const hx = s.dx * s.len * 0.5, hy = s.dy * s.len * 0.5;

    const grad = ctx.createLinearGradient(s.x - hx, s.y - hy, s.x + hx, s.y + hy);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.5, 'rgba(255,255,255,' + a + ')');
    grad.addColorStop(1, 'rgba(255,255,255,0)');

    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.moveTo(s.x - hx, s.y - hy);
    ctx.lineTo(s.x + hx, s.y + hy);
    ctx.lineWidth = 22 * a;
    ctx.strokeStyle = 'rgba(140,220,255,' + (a * 0.45) + ')';
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(s.x - hx, s.y - hy);
    ctx.lineTo(s.x + hx, s.y + hy);
    ctx.lineWidth = 9 * a;
    ctx.strokeStyle = grad;
    ctx.stroke();
  }
  ctx.restore();
}

function drawBlade() {
  const now = performance.now();
  G.blade = G.blade.filter(p => now - p.t < 175);
  const pts = G.blade;
  if (pts.length < 2) return;

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.globalCompositeOperation = 'lighter';

  /* 外層光暈 */
  for (let i = 1; i < pts.length; i++) {
    const k = i / (pts.length - 1);
    ctx.beginPath();
    ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
    ctx.lineTo(pts[i].x, pts[i].y);
    ctx.lineWidth = 34 * k;
    ctx.strokeStyle = 'rgba(120,200,255,' + (0.10 * k) + ')';
    ctx.stroke();
  }
  /* 中層 */
  for (let i = 1; i < pts.length; i++) {
    const k = i / (pts.length - 1);
    ctx.beginPath();
    ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
    ctx.lineTo(pts[i].x, pts[i].y);
    ctx.lineWidth = 16 * k;
    ctx.strokeStyle = 'rgba(190,235,255,' + (0.35 * k) + ')';
    ctx.stroke();
  }
  /* 核心亮線 */
  ctx.globalCompositeOperation = 'source-over';
  for (let i = 1; i < pts.length; i++) {
    const k = i / (pts.length - 1);
    ctx.beginPath();
    ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
    ctx.lineTo(pts[i].x, pts[i].y);
    ctx.lineWidth = 6 * k;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.95 * k) + ')';
    ctx.stroke();
  }

  /* 刀鋒頭 */
  const head = pts[pts.length - 1];
  const hg = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 26);
  hg.addColorStop(0, 'rgba(255,255,255,0.95)');
  hg.addColorStop(0.4, 'rgba(180,235,255,0.5)');
  hg.addColorStop(1, 'rgba(120,200,255,0)');
  ctx.beginPath(); ctx.arc(head.x, head.y, 26, 0, Math.PI * 2);
  ctx.fillStyle = hg; ctx.fill();

  ctx.restore();
}

function drawPopups() {
  ctx.save();
  ctx.textAlign = 'center';
  for (const p of G.popups) {
    const a = Math.min(1, p.life / p.maxLife * 1.8);
    ctx.globalAlpha = a;
    ctx.font = 'bold ' + p.size + 'px ' + FONT;
    ctx.fillStyle = p.color;
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 10;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.restore();
}

/* ============================================================
   重新開始按鈕
============================================================ */
function drawRestartBtn() {
  const cx = RESTART_BTN.x + RESTART_BTN.size / 2;
  const cy = RESTART_BTN.y + RESTART_BTN.size / 2;
  const R = RESTART_BTN.size / 2;

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.20)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  const rr = R * 0.52;
  ctx.beginPath();
  ctx.arc(cx, cy, rr, -Math.PI * 0.28, Math.PI * 1.28);
  ctx.strokeStyle = 'rgba(255,255,255,0.72)';
  ctx.lineWidth = 2.6;
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx + rr * 0.55, cy - rr * 0.98);
  ctx.lineTo(cx + rr * 1.32, cy - rr * 0.72);
  ctx.lineTo(cx + rr * 0.68, cy - rr * 0.08);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.78)';
  ctx.fill();
  ctx.restore();
}

/* ============================================================
   HUD / 選單
============================================================ */
function drawHUD() {
  ctx.save();

  /* 分數 */
  ctx.textAlign = 'right';
  ctx.shadowColor = 'rgba(0,0,0,0.65)';
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.min(46, W * 0.085) + 'px ' + FONT;
  ctx.fillText(String(G.score), W - 24, 58);

  ctx.shadowBlur = 0;
  ctx.font = '500 ' + Math.min(15, W * 0.032) + 'px ' + FONT;
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('分數', W - 24, 80);

  /* 最高分 */
  ctx.font = '500 ' + Math.min(14, W * 0.03) + 'px ' + FONT;
  ctx.fillStyle = 'rgba(255,255,255,0.32)';
  ctx.fillText('最高 ' + G.best, W - 24, 102);

  /* 連擊提示 */
  if (G.combo >= 3 && G.comboTimer > 0) {
    ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, G.comboTimer / 0.4);
    ctx.font = 'bold ' + Math.min(30, W * 0.06) + 'px ' + FONT;
    ctx.fillStyle = '#ffd24a';
    ctx.shadowColor = 'rgba(255,180,0,0.9)';
    ctx.shadowBlur = 20;
    ctx.fillText('連擊 x' + G.combo, W / 2, 62);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  drawRestartBtn();
}

function drawMenu() {
  ctx.save();
  ctx.textAlign = 'center';
  const t = performance.now() / 1000;

  const titleSize = Math.min(74, W * 0.135);
  ctx.font = 'bold ' + titleSize + 'px ' + FONT;
  ctx.shadowColor = '#ff3b5c';
  ctx.shadowBlur = 36;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('水果忍者', W / 2, H * 0.36);

  ctx.shadowBlur = 0;
  ctx.font = '500 ' + Math.min(19, W * 0.042) + 'px ' + FONT;
  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.fillText('按住並滑動來切水果', W / 2, H * 0.36 + titleSize * 0.72);

  ctx.fillStyle = 'rgba(150,230,255,0.75)';
  ctx.fillText('無限模式 · 盡情切！', W / 2, H * 0.36 + titleSize * 0.72 + 30);

  const a = 0.45 + 0.55 * Math.sin(t * 3.2);
  ctx.globalAlpha = a;
  ctx.font = 'bold ' + Math.min(28, W * 0.056) + 'px ' + FONT;
  ctx.fillStyle = '#ffd24a';
  ctx.fillText('點擊開始', W / 2, H * 0.63);
  ctx.globalAlpha = 1;

  if (G.best > 0) {
    ctx.font = '500 ' + Math.min(17, W * 0.038) + 'px ' + FONT;
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText('最高分：' + G.best, W / 2, H * 0.73);
  }

  ctx.restore();
}

/* ============================================================
   主渲染
============================================================ */
function render() {
  ctx.save();

  if (G.shake > 0) {
    ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
  }

  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);
  else { ctx.fillStyle = '#12101a'; ctx.fillRect(0, 0, W, H); }

  drawWaves();
  for (const h of G.halves) drawHalf(h);
  for (const f of G.fruits) drawFruit(f);

  drawJuice();
  drawParticles();
  drawSlashes();
  drawBlade();
  drawPopups();

  ctx.restore();

  /* 全螢幕閃光 */
  if (G.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (G.flash * 0.13) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  if (G.state === 'playing') drawHUD();
  if (G.state === 'menu') drawMenu();
}

/* ============================================================
   主迴圈
============================================================ */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.045);
  lastT = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ============================================================
   輸入
============================================================ */
function getPos(e) {
  const r = cvs.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function inRestartBtn(p) {
  return p.x >= RESTART_BTN.x && p.x <= RESTART_BTN.x + RESTART_BTN.size &&
         p.y >= RESTART_BTN.y && p.y <= RESTART_BTN.y + RESTART_BTN.size;
}

cvs.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  initAudio();

  const p = getPos(e);

  if (G.state === 'menu') { startGame(); return; }

  if (G.state === 'playing' && inRestartBtn(p)) {
    startGame();
    return;
  }

  isSlicing = true;
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  lastPos = p;
  G.blade.length = 0;
  G.blade.push({ x: p.x, y: p.y, t: performance.now() });
}, { passive: false });

cvs.addEventListener('pointermove', function (e) {
  if (!isSlicing || G.state !== 'playing') return;
  e.preventDefault();

  const p = getPos(e);
  const now = performance.now();

  const dx = p.x - lastPos.x, dy = p.y - lastPos.y;
  if (dx * dx + dy * dy < 4) return;

  G.blade.push({ x: p.x, y: p.y, t: now });
  checkSlice(lastPos, p);

  lastPos = p;
}, { passive: false });

function endSlice() { isSlicing = false; }
cvs.addEventListener('pointerup', endSlice);
cvs.addEventListener('pointercancel', endSlice);
cvs.addEventListener('pointerleave', endSlice);

document.addEventListener('touchmove', function (e) {
  if (e.target === cvs) e.preventDefault();
}, { passive: false });

/* ============================================================
   啟動
============================================================ */
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () {
  setTimeout(resize, 120);
});

resize();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
